    </head>
    <body>
        <!--MENU-->
        <section class="menu">
            <div class="menu--area">
                    <div class="menu--ret"> <!-- separando uma area para estilizar   no CSS -->
                        <div class="menu--ret-nav">
                            <div class="menu--ret-logo-area">
                                <a href="index.html"><img class="menu--ret-logo-img" src="assets/Logomarca.png" alt="SALAO SABRINA">
                                </a>
                                <div class="texto-logo-area"> <!-- Essa DIV irá funcionar como um bloco para manter o texto em coluna e ficar editável em linha na TAG pai junto com o logomarca-->

                                    <h2 class="texto2-logo">S A L Ã O</h2>
                                </div>

                        </nav>  
                        </div>
                    </div>
            </div>
        </section>
        <!--FIM MENU-->

        <section id="formulario">
            <h2 class="formulario--texto" id="titulo">Preencha os dados abaixo para agendar:</h2>

            <form autocomplete="off"> <!--Por ser apenas um modelo, não estou usando <action> e <method>-->
                    <label for="nomeCompleto" class="formulario--label">Nome completo:</label>
                    <input type="text" id="nomeCompleto" name="nomeCompleto" class="formulario--input" placeholder="Nome Completo"/>

                    <label for="telefone" class="formulario--label">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" class="formulario--input" placeholder="Telefone"/>

                    <label for="servico" class="formulario--label">Telefone:</label>
                    <input type="text" id="servico" name="servico" class="formulario--input" placeholder="Serviço">
                    
                    <label for="horario" class="formulario--label">Horário</label>
                    <input type="text" id="horario" name="horario" class="formulario--input" placeholder="Horário">

                    <label for="data" class="formulario--label">Data</label>
                    <input type="text" id="data" name="data" class="formulario--input" placeholder="Data">

                    <button type="submit" id="formulario--botao">AGENDAR</button>
                    
            </form>

        </section>

        <!--FOOTER-->          
        <footer>
            <div id="footer--area-rosa">
                <div class="footer--texto" id="footer--texto3">© 2025 TODOS OS DIREITOS RESERVADOS
